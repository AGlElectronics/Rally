# Rally (Events) — base Docker Compose stack for Docker Desktop.
#
# Container ports:
#   Every module in this ecosystem binds :8080 inside its container.
#   The HOST port for Rally is 8100 (API) and 3002 (SPA). Mapping below.
#
# NOTE on MinIO: this file wires MinIO as the local S3-compatible object
# store for the events-data-dev bucket. MinIO is for LOCAL DEVELOPMENT
# ONLY and must NEVER be used in production (see docs/adr/0004-minio-
# never-production.md). Production object storage must point at a managed
# S3-compatible bucket on the target cloud.
#
# Migrations: the `migrate` service is a ONE-SHOT. The backend depends on
# it with service_completed_successfully so cmd/server never runs
# migrations itself. See docs/adr/0003-migrate-job.md.
#
# Reserved HOST ports (Rally / Events module):
#   backend   : 8100  (container :8080)
#   frontend  :  3002 (container :80)
#   postgres  :  5435 (container :5432)
#   minio API :  9020 (container :9000, dev-only)
#   minio UI  :  9021 (container :9001, dev-only)

name: rally

services:
  postgres:
    image: postgres:16-alpine
    container_name: rally-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rally
    ports:
      - "5435:5432"
    volumes:
      - rally-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d rally"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LOCAL DEV ONLY — never deploy MinIO as Rally's production object store.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rally-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rally
      MINIO_ROOT_PASSWORD: rallyrally
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - rally-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc --version >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrapper so events-data-dev exists on first `up`.
  # The backend also creates the bucket if missing, but doing it here keeps
  # the API container's first boot deterministic.
  minio-init:
    image: minio/mc:RELEASE.2025-04-22T22-12-26Z
    container_name: rally-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      sh -c "
      set -e;
      until mc alias set local http://minio:9000 rally rallyrally >/dev/null 2>&1; do
        echo 'waiting for minio'; sleep 1;
      done;
      mc mb --ignore-existing local/events-data-dev;
      echo 'bucket ready: events-data-dev';
      "

  # One-shot migrator. Exits zero on success; the backend waits for that.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.migrate
    container_name: rally-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://rally:rally@postgres:5432/rally?sslmode=disable
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: rally-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      # Browser-facing base URL uses the HOST port so links in logs /
      # emails / dev tooling point at something a human can click.
      APP_BASE_URL: http://localhost:8100
      # Container binds :8080 (ecosystem convention). Compose maps 8100 -> 8080.
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://rally:rally@postgres:5432/rally?sslmode=disable
      # Object storage — MinIO is LOCAL DEV ONLY, never production.
      S3_ENABLED: "true"
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-events-data-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rally}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rallyrally}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      # Rewrite presigned URLs so the browser (which lives on the host) can
      # resolve them even though the backend talks to minio:9000.
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9020}
      # Auth: dev = X-Dev-User header; oidc = verify Bearer JWT.
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_DEFAULT_USER: dev-admin
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      # Pairing with Den happens in the app (Settings → Den connection).
      # Set this when the pairing URL Den shows is not reachable from here.
      DEN_INTERNAL_URL: ${DEN_INTERNAL_URL:-}
      # CORS only matters for `npm run dev` on the host — in prod the SPA
      # talks to /api via the nginx reverse proxy on the same origin.
      CORS_ALLOWED_ORIGINS: http://localhost:3002
    ports:
      - "8100:8080"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_PRODUCT_NAME: ${VITE_PRODUCT_NAME:-Rally}
        RALLY_VERSION: ${RALLY_VERSION:-dev}
    container_name: rally-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3002:80"

volumes:
  rally-postgres-data:
  rally-minio-data:
