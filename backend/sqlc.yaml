version: "2"
# sqlc configuration. Not yet executed in Rally's build pipeline; the
# scaffold uses hand-written pgx queries so the backend is buildable without
# the sqlc toolchain. The config lives here so adding sqlc to the next
# milestone is a one-command change (`sqlc generate`) rather than a layout
# migration. See docs/adr/0001-initial-scaffold.md.
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
